name: publish-github-packages

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish @ejfkdev/ddc to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"

      - name: Publish npm wrapper
        working-directory: packaging/npm/ddc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          package="@ejfkdev/ddc@$version"
          if npm view "$package" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "$package is already published"
            exit 0
          fi
          if npm publish --access public; then
            exit 0
          fi
          if npm view "$package" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "$package is already published"
            exit 0
          fi
          exit 1